<style>
  /* Single, deliberate night-sky look (not theme-switched). */
  :root {
    color-scheme: dark;
    --night: #05060f;
    --ink: #0b0e22;
    --lantern: #ffb45a;
    --lantern-soft: rgba(255, 180, 90, .35);
    --moon: #fff1cf;
    --blossom: #f7c3d6;
    --text: #f3ead8;
    --muted: #a9a3b8;
    --display: "Dancing Script", "Brush Script MT", cursive;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--night); color: var(--text);
    font-family: var(--ui); font-size: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  .hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
         padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px calc(env(safe-area-inset-bottom, 0px) + 18px); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(34px, 6vw, 56px); line-height: 1;
              color: var(--moon); text-shadow: 0 0 24px rgba(255, 200, 120, .45); text-wrap: balance; }
  .brand p { margin: 6px 0 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .brand .count { margin-top: 4px; font-family: var(--serif); font-style: italic; font-size: 17px; letter-spacing: 0; text-transform: none; color: var(--lantern); }
  .tools { display: flex; gap: 10px; pointer-events: auto; }
  .icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--lantern-soft); background: rgba(11, 14, 34, .55);
              color: var(--lantern); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(6px); transition: background .2s, transform .2s; }
  .icon-btn:hover { background: rgba(255, 180, 90, .14); transform: translateY(-1px); }
  .icon-btn:focus-visible, .wish button:focus-visible, .wish input:focus-visible, .card .close:focus-visible, .intro button:focus-visible { outline: 2px solid var(--lantern); outline-offset: 3px; }
  .icon-btn[aria-pressed="true"] { background: rgba(255, 180, 90, .22); }
  .icon-btn svg { width: 18px; height: 18px; }

  .bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .hint { font-size: 12.5px; color: var(--muted); letter-spacing: .02em; text-align: center; }
  .wish { pointer-events: auto; display: flex; gap: 8px; width: min(460px, 100%); padding: 6px; border-radius: 999px;
          background: rgba(11, 14, 34, .6); border: 1px solid var(--lantern-soft); backdrop-filter: blur(8px); }
  .wish input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text); font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; }
  .wish input::placeholder { color: #7e7893; }
  .wish button { border: 0; border-radius: 999px; padding: 9px 18px; font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap;
                 color: #2a1405; background: linear-gradient(180deg, #ffd08a, #ff9f45); box-shadow: 0 0 18px rgba(255, 160, 70, .45); }
  .wish button:hover { filter: brightness(1.08); }
  .love { pointer-events: auto; border: 1px solid rgba(255, 150, 175, .55); background: rgba(60, 14, 34, .55); color: #ffc6d3; font: inherit; font-size: 13.5px;
          padding: 8px 18px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(6px); letter-spacing: .02em; box-shadow: 0 0 22px rgba(255, 110, 150, .25); }
  .love:hover { background: rgba(90, 20, 50, .65); }
  .love:focus-visible { outline: 2px solid #ffc6d3; outline-offset: 3px; }

  [hidden] { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); transform: translate(-50%, 10px); opacity: 0;
           padding: 8px 16px; border-radius: 999px; background: rgba(11, 14, 34, .8); border: 1px solid var(--lantern-soft);
           color: var(--lantern); font-size: 13px; pointer-events: none; transition: opacity .35s, transform .35s; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .veil { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(3, 4, 12, .45);
          opacity: 0; pointer-events: none; transition: opacity .35s; overflow-y: auto; }
  .veil.open { opacity: 1; pointer-events: auto; }
  .card { position: relative; width: min(380px, 100%); padding: 22px 22px 18px; border-radius: 18px; text-align: center;
          background: linear-gradient(180deg, rgba(34, 24, 52, .92), rgba(14, 12, 30, .94)); border: 1px solid rgba(255, 190, 110, .4);
          box-shadow: 0 0 60px rgba(255, 170, 80, .22), inset 0 0 30px rgba(255, 190, 120, .06);
          transform: translateY(14px) scale(.96); transition: transform .45s cubic-bezier(.2, .9, .3, 1.2); }
  .veil.open .card { transform: none; }
  .card h2 { margin: 0 0 12px; font-family: var(--display); font-size: 34px; color: #ffcf7d; font-weight: 700; }
  .photos { position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 4; max-height: 46vh; border-radius: 12px; overflow: hidden;
            box-shadow: 0 0 0 1px rgba(255, 200, 130, .35), 0 10px 30px rgba(0, 0, 0, .45); }
  .photos img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.08);
                transition: opacity 1.1s ease, transform 4s ease-out; }
  .photos img.on { opacity: 1; transform: scale(1); }
  .card blockquote { margin: 16px 4px 12px; font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1.5; color: var(--text); white-space: pre-line; }
  .card .sign { font-size: 10.5px; letter-spacing: .28em; text-transform: uppercase; color: #bfa37a; }
  .card .close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--lantern-soft);
                 background: transparent; color: var(--lantern); cursor: pointer; font-size: 16px; line-height: 1; }

  .intro { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px;
           background: radial-gradient(ellipse at center, rgba(5, 6, 15, .35), rgba(5, 6, 15, .8)); transition: opacity 1.2s; }
  .intro.gone { opacity: 0; pointer-events: none; }
  .intro .big { font-family: var(--display); font-size: clamp(56px, 12vw, 120px); line-height: 1; color: var(--moon); text-shadow: 0 0 40px rgba(255, 190, 110, .6); }
  .intro .sub { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--muted); margin: 10px 0 26px; }
  .intro button { border: 1px solid rgba(255, 190, 110, .6); background: rgba(255, 170, 80, .12); color: #ffd79a; font: inherit; font-size: 15px;
                  padding: 12px 28px; border-radius: 999px; cursor: pointer; letter-spacing: .06em; box-shadow: 0 0 30px rgba(255, 160, 70, .3);
                  animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 50px rgba(255, 160, 70, .55); } }
  @media (max-width: 560px) { .hint { font-size: 11.5px; } .brand p { font-size: 10.5px; } }
  @media (prefers-reduced-motion: reduce) { .intro button { animation: none; } .card { transition: none; } }
</style>

<canvas id="scene" aria-label="Cảnh đêm Trung Thu 3D: đảo nổi, cây đa treo đèn lồng, thỏ ngọc, cá chép và đèn trời trên mặt hồ"></canvas>

<div class="hud">
  <div class="top">
    <div class="brand">
      <h1>Đêm Rằm</h1>
      <p>Rằm tháng Tám · 15/8 Âm lịch</p>
      <p class="count" id="countdown">Thứ Sáu, 25.09.2026</p>
    </div>
    <div class="tools">
      <button class="icon-btn" id="musicBtn" aria-pressed="false" aria-label="Bật nhạc" title="Nhạc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      </button>
      <button class="icon-btn" id="songBtn" aria-label="Chọn bài hát từ máy" title="Chọn bài hát (.mp3) từ máy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l8-1.5v6"/><circle cx="6" cy="18" r="3"/><path d="M18 14v6M15 17h6"/></svg>
      </button>
      <input type="file" id="songFile" accept="audio/*" hidden>
      <button class="icon-btn" id="fsBtn" aria-label="Toàn màn hình" title="Toàn màn hình">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </div>
  <div class="bottom">
    <button class="love" id="loveBtn" type="button">♥ Thắp chữ “Châm” lên trời</button>
    <div class="hint">Chạm vào đèn trời, đèn lồng, cá chép hay tấm ảnh để đọc thơ anh gửi Châm · kéo để xoay cảnh</div>
    <form class="wish" id="wishForm" autocomplete="off">
      <label for="wishInput" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Điều ước của bạn</label>
      <input id="wishInput" maxlength="120" placeholder="Viết một điều ước cho hai đứa…">
      <button type="submit">Thả đèn</button>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>


<div class="veil" id="veil" aria-hidden="true">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <button class="close" id="closeCard" aria-label="Đóng">×</button>
    <h2 id="cardTitle">Gửi Châm</h2>
    <div class="photos" id="cardPhotos" role="img" aria-label="Ảnh người yêu"></div>
    <blockquote id="cardText"></blockquote>
    <div class="sign">✦ Trung Thu có anh có Châm ✦</div>
  </div>
</div>

<div class="intro" id="intro">
  <div>
    <div class="big">Đêm Rằm</div>
    <div class="sub">trăng tròn, đèn sáng, và có Châm bên anh</div>
    <button id="startBtn">Thắp đèn &amp; nghe nhạc</button>
  </div>
</div>

  // ---------- countdown to Rằm tháng Tám 2026 (Thứ Sáu 25/09/2026) ----------
  (function countdown() {
    const el = document.getElementById('countdown');
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const days = Math.round((new Date(2026, 8, 25) - today) / 86400000);
    if (days > 1) el.textContent = `còn ${days} ngày nữa là trăng tròn · 25.09.2026`;
    else if (days === 1) el.textContent = 'ngày mai là Rằm · 25.09.2026';
    else if (days === 0) el.textContent = 'đêm nay trăng tròn nhất năm';
    else el.textContent = 'Trung Thu vừa qua — trăng vẫn còn đầy';
  })();

  // ---------- stars ----------
  (function stars() {
    const N = isSmall ? 1800 : 3500;
    const pos = new Float32Array(N * 3), size = new Float32Array(N), ph = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const u = Math.random(), th = Math.random() * Math.PI * 2, r = 420, s = Math.sqrt(1 - u * u);
      pos.set([r * s * Math.cos(th), r * u - 60, r * s * Math.sin(th)], i * 3);

    })));
  })();

  // ---------- moon ----------
  const moonGroup = new THREE.Group();
  moonGroup.position.set(-20, 50, -120);

  (function moon() {
    const m = new THREE.ShaderMaterial({
      fog: false,
      vertexShader: `varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(normalMatrix*normal); vP = position;
        gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `varying vec3 vN; varying vec3 vP;
        float h(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719)))*43758.5453); }
        float n(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
          return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
                     mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z); }

    cg.beginPath(); cg.arc(256, 256, 250, 0, Math.PI * 2); cg.clip();

  // ---------- floating island ----------
  const island = new THREE.Group(); scene.add(island);
  (function buildIsland() {
    const g = new THREE.CylinderGeometry(13, 2.2, 11, 72, 10, false);

    const cTop = new THREE.Color(0x26323f), cGrass = new THREE.Color(0x1c3230), cRock = new THREE.Color(0x2c2436), cDeep = new THREE.Color(0x100c18);
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const a = Math.atan2(z, x);

      let c;

        c = cGrass.clone().lerp(cTop, Math.random() * .5);

        p.setX(i, x * k); p.setZ(i, z * k); p.setY(i, y - Math.random() * .5 * t);
        c = cRock.clone().lerp(cDeep, t);
      }
      col.push(c.r, c.g, c.b);
    }
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.computeVertexNormals();
    island.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95, flatShading: true })));

    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x3d394b, roughness: 1, flatShading: true });
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, r = rand(6.5, 12.2);
      const s = new THREE.Mesh(new THREE.DodecahedronGeometry(rand(.15, .55), 0), stoneMat);
      s.position.set(Math.cos(a) * r, .1, Math.sin(a) * r); s.rotation.set(Math.random() * 3, Math.random() * 3, 0);
      island.add(s);
    }

      const s = new THREE.Mesh(new THREE.DodecahedronGeometry(rand(.4, 1.3), 0), stoneMat);
      const a = Math.random() * 6.28, r = rand(10, 18);
      s.position.set(Math.cos(a) * r, rand(-14, -5), Math.sin(a) * r);

      const a = Math.random() * 6.28, r = rand(0, 16);
      sp.position.set(Math.cos(a) * r, rand(-16, -9), Math.sin(a) * r);

  // opening shot: the camera starts on the moon, then glides down to the island
  camera.position.set(-10, 42, -62);
  controls.target.copy(moonGroup.position);
  controls.autoRotate = false;

  // ---------- helpers ----------
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const tmpV = new THREE.Vector3();
  const clickables = []; // meshes that open a poem card when tapped
  const swingers = [];   // hanging lanterns that sway in the breeze
  // a tube whose radius tapers from r0 to r1 along a smooth curve
  function taperTube(points, r0, r1, seg = 20, radial = 7) {
    const curve = new THREE.CatmullRomCurve3(points);
    const g = new THREE.TubeGeometry(curve, seg, 1, radial, false);
    const pos = g.attributes.position, P = new THREE.Vector3(), v = new THREE.Vector3();
    for (let i = 0; i <= seg; i++) {
      curve.getPointAt(i / seg, P);
      const r = r0 + (r1 - r0) * Math.pow(i / seg, .8);
      for (let j = 0; j <= radial; j++) {
        const k = i * (radial + 1) + j;
        v.fromBufferAttribute(pos, k).sub(P).multiplyScalar(r).add(P);
        pos.setXYZ(k, v.x, v.y, v.z);
      }
    }

    return { g, curve };
  }
  const toonRamp = (() => {
    const t = new THREE.DataTexture(new Uint8Array([80, 150, 210, 255]), 4, 1, THREE.RedFormat);
    t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
  })();
  function barkTexture() {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const g = c.getContext('2d'); g.fillStyle = '#5a4538'; g.fillRect(0, 0, 256, 128);
    for (let i = 0; i < 260; i++) {
      const y = Math.random() * 128, l = rand(30, 160), x = Math.random() * 256;
      g.strokeStyle = `rgba(${Math.random() < .5 ? '30,20,16' : '130,108,90'},${rand(.15, .5)})`;
      g.lineWidth = rand(.6, 2.2); g.beginPath(); g.moveTo(x, y);

    }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 1); return t;
  }

  // silk Hội An lantern: ribbed glowing silk, lacquered caps, gold knot and tassel
  const cordMat = new THREE.MeshBasicMaterial({ color: 0x2a1a12 });
  const goldMat = new THREE.MeshBasicMaterial({ color: 0xe9b949 });
  const hoiAnGeo = new THREE.LatheGeometry([[.14, -.56], [.34, -.5], [.49, -.33], [.56, -.1], [.56, .1], [.49, .33], [.34, .5], [.14, .56]]
    .map(([x, y]) => new THREE.Vector2(x, y)), 32);
  const capGeo = new THREE.CylinderGeometry(.17, .2, .1, 16);
  const capMat = new THREE.MeshStandardMaterial({ color: 0x6b1d12, emissive: 0x3a0a04, roughness: .5, metalness: .3 });
  function silkMaterial(color) {
    return new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color(color) }, uGlow: { value: 1 } },
      vertexShader: `varying vec2 vUv; varying vec3 vN; void main(){ vUv = uv; vN = normalize(normalMatrix*normal);
        gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `uniform vec3 uColor; uniform float uGlow; varying vec2 vUv; varying vec3 vN;
        void main(){ float core = pow(abs(vN.z), 1.4);
          float seam = smoothstep(.43, .5, abs(fract(vUv.x*14.0) - .5));

          c *= (1.0 - .5*seam) * (.35 + .65*band) * uGlow;

    });
  }
  function makeHoiAn(color, s) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(hoiAnGeo, silkMaterial(color)); g.add(body);
    const top = new THREE.Mesh(capGeo, capMat); top.position.y = .58; g.add(top);
    const bot = top.clone(); bot.position.y = -.58; g.add(bot);
    const knot = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 6), goldMat); knot.position.y = -.68; g.add(knot);
    const tassel = new THREE.Mesh(new THREE.CylinderGeometry(.02, .1, .6, 8), silkMaterial(color)); tassel.position.y = -1.0; g.add(tassel);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: warmGlow, color, blending: THREE.AdditiveBlending, depthWrite: false, opacity: .55 }));
    halo.scale.set(3.4, 3.4, 1); g.add(halo);
    g.scale.setScalar(s);
    body.userData.poem = true; clickables.push(body);
    return g;
  }

  // small five-point star lantern (đèn ông sao)
  function makeStarLantern(s) {
    const shape = new THREE.Shape();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? .45 : 1.1, a = Math.PI / 2 + i * Math.PI / 5;
      i ? shape.lineTo(Math.cos(a) * r, Math.sin(a) * r) : shape.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    const geo = new THREE.ExtrudeGeometry(shape, { depth: .3, bevelEnabled: true, bevelThickness: .25, bevelSize: .1, bevelSegments: 2 }); geo.center();
    const g = new THREE.Group();
    g.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xff6040 })));
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), new THREE.LineBasicMaterial({ color: 0xffe08a })));
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: warmGlow, color: 0xff7040, blending: THREE.AdditiveBlending, depthWrite: false, opacity: .45 }));
    glow.scale.set(3.2, 3.2, 1); g.add(glow);
    g.scale.setScalar(s); return g;
  }

  // ---------- lake below the floating island (mirror with gentle ripples) ----------
  const lake = new THREE.Reflector(new THREE.PlaneGeometry(1000, 1000), {
    clipBias: .003, color: 0x888888,
    textureWidth: innerWidth * DPR * (isSmall ? .35 : .5), textureHeight: innerHeight * DPR * (isSmall ? .35 : .5),
    shader: {
      uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, uTime: { value: 0 } },
      vertexShader: `uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vWorld;

      fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec4 vUv; varying vec3 vWorld;

    }
  });
  lake.rotation.x = -Math.PI / 2; lake.position.y = -20; scene.add(lake);

  // ---------- cây đa (banyan): twisted trunk, aerial roots, fairy lights, Hội An lanterns ----------
  const tree = new THREE.Group(); tree.position.set(0, 0, -1); island.add(tree);
  const limbs = [];
  // spots on the ground kept clear for the bunnies, the mooncake plate and the kéo quân lantern (tree-local)
  const reserved = [V(2, 0, 5.4), V(4.3, 0, 4.5), V(-4.6, 0, 4.6), V(-8, 0, 1.6)].map(p => p.sub(V(0, 0, -1)));
  (function buildBanyan() {
    const geos = [];
    for (let s = 0; s < 5; s++) { // five strands twisting around each other
      const a0 = s / 5 * Math.PI * 2 + rand(-.2, .2), pts = [];
      for (let k = 0; k <= 6; k++) {
        const h = k / 6, r = THREE.MathUtils.lerp(2.3, .35, Math.pow(h, .55)), a = a0 + h * 1.1;
        pts.push(V(Math.cos(a) * r, -.4 + h * 5.6, Math.sin(a) * r));
      }
      geos.push(taperTube(pts, .62, .3, 24, 8).g);
    }
    for (let i = 0; i < 9; i++) { // surface roots over the ground
      const a = i / 9 * Math.PI * 2 + rand(-.2, .2), L = rand(3, 5);
      geos.push(taperTube([V(Math.cos(a) * 1.5, .4, Math.sin(a) * 1.5), V(Math.cos(a) * (1.5 + L * .5), .05, Math.sin(a) * (1.5 + L * .5)),
        V(Math.cos(a + .2) * (1.5 + L), -.15, Math.sin(a + .2) * (1.5 + L))], .32, .06, 12, 6).g);
    }
    const nL = 8;
    for (let i = 0; i < nL; i++) { // wide, near-horizontal limbs: the umbrella of a village banyan
      const a = i / nL * Math.PI * 2 + rand(-.25, .25), reach = rand(6.5, 8.8), lift = rand(1.5, 3.5);
      const p0 = V(Math.cos(a) * .3, rand(4.4, 5.2), Math.sin(a) * .3);
      const { g, curve } = taperTube([p0, V(Math.cos(a) * reach * .35, p0.y + lift * .7, Math.sin(a) * reach * .35),
        V(Math.cos(a + .15) * reach * .7, p0.y + lift, Math.sin(a + .15) * reach * .7),
        V(Math.cos(a + .25) * reach, p0.y + lift * .8 + rand(-.4, .6), Math.sin(a + .25) * reach)], .42, .07, 24, 7);
      geos.push(g); limbs.push(curve);
      for (const t0 of [.45, .7]) {
        const b0 = curve.getPointAt(t0), side = a + (Math.random() < .5 ? .7 : -.7), L = rand(1.6, 2.8);
        const b1 = V(b0.x + Math.cos(side) * L * .6, b0.y + rand(.6, 1.4), b0.z + Math.sin(side) * L * .6);
        const b2 = V(b0.x + Math.cos(side) * L, b1.y + rand(.2, .9), b0.z + Math.sin(side) * L);
        const sb = taperTube([b0, b1, b2], .14, .04, 10, 5); geos.push(sb.g); limbs.push(sb.curve);
      }
    }
    for (let i = 0; i < 4; i++) { // upward leaders to dome the crown
      const a = i / 4 * Math.PI * 2 + .4;
      const sb = taperTube([V(0, 4.8, 0), V(Math.cos(a) * 1.5, 7.2, Math.sin(a) * 1.5), V(Math.cos(a) * 2.4, 9.6 + rand(0, 1), Math.sin(a) * 2.4)], .3, .06, 14, 6);
      geos.push(sb.g); limbs.push(sb.curve);
    }
    let made = 0, tries = 0; // aerial roots, some reaching the ground like pillars
    while (made < 34 && tries++ < 400) {
      const c = limbs[Math.floor(Math.random() * nL * 3)], p = c.getPointAt(rand(.3, .95));
      if (reserved.some(r => Math.hypot(r.x - p.x, r.z - p.z) < 1.8)) continue;

  }
  (async () => {
    try { const db = await songDb(); const q = db.transaction('kv').objectStore('kv').get('song'); q.onsuccess = () => { savedSong = q.result || null; }; } catch (e) {}
  })();
  const songFile = document.getElementById('songFile');
  document.getElementById('songBtn').addEventListener('click', () => songFile.click());
  songFile.addEventListener('change', async () => {
    const f = songFile.files[0]; if (!f) return;
    const name = f.name.replace(/\.[^.]+$/, '');
    playSong(URL.createObjectURL(f), true, name).catch(() => showToast('Không phát được file này, hãy thử file .mp3 khác'));
    savedSong = f;
    try { const db = await songDb(); db.transaction('kv', 'readwrite').objectStore('kv').put(f, 'song'); } catch (e) {}
    songFile.value = '';
  });
  // ---------- the bundled song (nhac.js, kept next to this page) ----------
  // Decoded straight into memory: it plays even when the page is opened from disk, and the hearts can follow its bass.
  let songBuf = null, songSrc = null, songStartAt = 0, songOffset = 0, songWanted = false;
  const hasBundled = !!window.NHAC_MP3;
  if (hasBundled) {
    try {
      const bin = atob(window.NHAC_MP3), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      window.NHAC_MP3 = null;
      initAudio(); // created suspended; the first tap resumes it
      actx.decodeAudioData(u8.buffer, buf => { songBuf = buf; if (songWanted) { songWanted = false; useBundled(); } },
        () => { if (songWanted) { songWanted = false; songMode = 'synth'; setMusic(true); } });
    } catch (e) {}
  }
  function playBuffer() {
    songSrc = actx.createBufferSource(); songSrc.buffer = songBuf; songSrc.loop = true; songSrc.connect(songBus);
    const at = songOffset % songBuf.duration; songSrc.start(0, at); songStartAt = actx.currentTime - at;
  }
  function pauseBuffer() {
    if (!songSrc) return;
    songOffset = actx.currentTime - songStartAt; songSrc.stop(); songSrc.disconnect(); songSrc = null;
  }
  function useBundled() {
    if (songEl) songEl.pause();
    songMode = 'buffer'; songRouted = true; synth(false);
    if (!songSrc) playBuffer();
    markMusic(true);
  }

  // music at the start: a song picked with 🎵+ > the bundled song > the built-in melody
  function startMusic() {
    initAudio(); actx.resume();
    if (savedSong) { playSong(URL.createObjectURL(savedSong), true, savedSong.name ? savedSong.name.replace(/\.[^.]+$/, '') : '').catch(() => {}); return; }
    if (songBuf) { useBundled(); return; }
    if (hasBundled) { songWanted = true; return; } // still decoding: starts in a moment
    songMode = 'synth'; setMusic(true);
  }
  musicBtn.addEventListener('click', () => setMusic(!musicOn));

  document.getElementById('fsBtn').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => showToast('Trình duyệt này không hỗ trợ toàn màn hình'));
    } catch (e) { showToast('Trình duyệt này không hỗ trợ toàn màn hình'); }
  });

  // ---------- hearts drifting up, pulsing with the music ----------
  const beat = { value: 0 };
  let bassPeak = .1;
  (function hearts() {
    const N = isSmall ? 70 : 130;
    const p = new Float32Array(N * 3), c = new Float32Array(N * 3), s = new Float32Array(N), ph = new Float32Array(N);
    const cols = [0xff5c8a, 0xff8fb1, 0xff2e63, 0xffb3c7].map(h => new THREE.Color(h));
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2, r = rand(5, 32);
      p.set([Math.cos(a) * r, rand(-12, 32), Math.sin(a) * r - 1], i * 3);
      const k = pick(cols).clone().multiplyScalar(rand(.55, .85)); c.set([k.r, k.g, k.b], i * 3);
      s[i] = rand(.7, 1.4); ph[i] = Math.random() * 100;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    g.setAttribute('color', new THREE.BufferAttribute(c, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(s, 1));
    g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
    const pts = new THREE.Points(g, new THREE.ShaderMaterial({
      uniforms: { uTime, uPR, uBeat: beat }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
      vertexShader: `attribute float aSize; attribute float aPhase; uniform float uTime; uniform float uPR; uniform float uBeat;
        varying vec3 vC; varying float vA; varying float vRot;
        void main(){ float sp = (.35 + fract(aPhase*.13)*.45)*${MOTION.toFixed(2)};
          vec3 q = position;
          q.y = mod(position.y + uTime*sp + 12.0, 44.0) - 12.0;
          q.x += sin(uTime*.6 + aPhase)*1.2; q.z += cos(uTime*.5 + aPhase*1.7)*1.2;
          vA = smoothstep(-12.0, -6.0, q.y) * smoothstep(32.0, 24.0, q.y) * (.6 + .4*uBeat);
          vRot = sin(uTime*.8 + aPhase)*.35; vC = color*(1.0 + .5*uBeat);
          vec4 mv = modelViewMatrix*vec4(q, 1.0);
          gl_PointSize = aSize*uPR*(1.0 + .45*uBeat)*(300.0/-mv.z); gl_Position = projectionMatrix*mv; }`,
      fragmentShader: `varying vec3 vC; varying float vA; varying float vRot;
        void main(){ vec2 uv = (gl_PointCoord - .5)*2.4; uv.y = -uv.y;
          float cs = cos(vRot), sn = sin(vRot); uv = mat2(cs, -sn, sn, cs)*uv;
          vec2 q = vec2(uv.x, uv.y + .13); q.y -= sqrt(abs(q.x))*.5;
          float d = length(q) - .55;
          float a = smoothstep(.04, -.03, d) + exp(-max(d, 0.0)*7.0)*.35;
          if (a < .01) discard;
          gl_FragColor = vec4(vC, a*vA); }`
    }));
    pts.frustumCulled = false; scene.add(pts);
  })();
  // 0..1 pulse: the bass of the song when we can hear it, otherwise a soft heartbeat
  function updateBeat(t, dt) {
    let target = .15 + .2 * Math.pow(Math.max(0, Math.sin(t * Math.PI * .9)), 6);
    if (musicOn && analyser && (songMode === 'synth' || songRouted)) {
      analyser.getByteFrequencyData(freq);
      let e = 0; for (let i = 1; i < 10; i++) e += freq[i];
      e /= 9 * 255;
      bassPeak = Math.max(e, bassPeak - dt * .08, .05);
      target = Math.pow(e / bassPeak, 3);
    } else if (musicOn) target = .3 + .7 * Math.pow(Math.max(0, Math.sin(t * Math.PI * 1.17)), 8);
    beat.value = Math.max(target, beat.value - dt * 2.2);
  }

  const intro = document.getElementById('intro');
  document.getElementById('startBtn').addEventListener('click', () => {
    intro.classList.add('gone');
    startMusic();
    for (let i = 0; i < 6; i++) { // a small welcome flight of lanterns from the island
      const a = rand(0, Math.PI * 2);
      spawnLantern({ x: Math.cos(a) * rand(4, 11), y: rand(-2, 2), z: Math.sin(a) * rand(4, 11), wish: pick(WISHES), speed: rand(1.1, 1.6) });
    }
    // glide from the moon down to the island, then write her name in the sky
    flyCamera([camera.position.clone(), V(-36, 30, -20), V(-16, 16, 30), HOME.pos.clone()], controls.target.clone(), HOME.target.clone(), 8, () => {
      controls.autoRotate = !reduceMotion;
      setTimeout(writeLove, 2000);
    });
  });

  // ---------- loop ----------
  const clock = new THREE.Clock();
  const cuoi = moonGroup.userData.cuoi;
  function frame() {
    const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
    uTime.value = t; lake.material.uniforms.uTime.value = t;
    updateBeat(t, dt);

    island.position.y = Math.sin(t * .5) * .35 * MOTION;
    island.rotation.z = Math.sin(t * .3) * .01 * MOTION;
    floaters.forEach(f => { f.position.y = f.userData.baseY + Math.sin(t * .6 + f.userData.bob) * .6 * MOTION; f.rotation.y += dt * .1; });

    tree.userData.leaves.rotation.y = Math.sin(t * .4) * .006 * MOTION;
    swingers.forEach(p => {
      p.rotation.z = Math.sin(t * 1.1 + p.userData.phase) * .07 * MOTION;
      p.rotation.x = Math.cos(t * .9 + p.userData.phase) * .05 * MOTION;
    });

    bunnies.forEach(b => {
      const u = b.userData;
      u.head.rotation.z = Math.sin(t * .9 + u.phase) * .07 * MOTION;
      u.head.position.y = 1.22 + Math.sin(t * 2 + u.phase) * .015;
      if (t > u.nextTwitch) { u.twitch = t; u.nextTwitch = t + rand(2.5, 6); u.twitchEar = pick(u.ears); }
      u.ears.forEach(ear => {
        const k = ear === u.twitchEar ? Math.max(0, 1 - (t - u.twitch) * 3) : 0;
        ear.rotation.z = -ear.userData.side * (.2 + Math.sin(k * Math.PI * 3) * .3 * k);
      });
      if (u.star) u.star.rotation.y = Math.sin(t * .8) * .6 * MOTION;
      if (u.hop) { const c = (t * .5 + 1) % 5; b.position.y = c < .45 ? Math.sin(c / .45 * Math.PI) * .35 * MOTION : 0; }
    });

    carps.forEach(c => {
      const u = c.userData, a = u.ph + t * .11 * u.dir * MOTION;
      c.position.set(Math.cos(a) * u.r, u.h + Math.sin(t * .7 + u.ph) * 1.2, Math.sin(a) * u.r - 1);
      tmpV.set(-Math.sin(a) * u.dir, 0, Math.cos(a) * u.dir).add(c.position); c.lookAt(tmpV);
      c.rotateZ(Math.sin(t * 1.3 + u.ph) * .12);
      u.tail.rotation.y = Math.sin(t * 4.5 + u.ph) * .45;
    });

    photoRing.rotation.y += dt * .22 * MOTION;
    photoRing.children.forEach(f => { f.position.y = Math.sin(t * .8 + f.userData.bob) * .5 * MOTION; f.lookAt(camera.position); });

    // keep Chú Cuội's shadow on the side of the moon that faces us
    tmpV.copy(camera.position).sub(moonGroup.position).normalize().multiplyScalar(13.3);
    cuoi.position.copy(tmpV); cuoi.lookAt(camera.position);

    for (const l of lanterns) {
      const u = l.userData, f = u.form, forming = !!f && t >= f.start, ease = 1 - Math.exp(-dt * 2.2);
      u.mat.uniforms.uForm.value += ((forming ? 1 : 0) - u.mat.uniforms.uForm.value) * ease;
      u.mat.uniforms.uTint.value.lerp(forming ? f.color : u.tint0, ease);
      u.halo.material.color.lerp(forming ? f.color : HALO_WARM, ease);
      u.dim += ((showing && !f ? .3 : 1) - u.dim) * ease;
      if (forming) {
        tmpV.copy(f.p); tmpV.y += Math.sin(t * 1.4 + u.phase) * .15;
        l.position.lerp(tmpV, 1 - Math.exp(-dt * 1.3));
        l.scale.setScalar(THREE.MathUtils.lerp(l.scale.x, .62, 1 - Math.exp(-dt * 2)));
      } else {
        l.position.y += u.speed * dt * MOTION;
        l.position.x = u.base.x + Math.sin(t * .3 + u.phase) * 1.4;
        l.position.z = u.base.z + Math.cos(t * .25 + u.phase) * 1.0;
        if (!f && l.position.y > 70) { // recycle to just above the lake
          const p = randomLanternPos(); u.base.x = p.x; u.base.z = p.z; l.position.y = -15;
          u.speed = u.mine ? rand(.4, .7) : rand(.35, .8);
        }
      }
      l.rotation.y += dt * .2;
      l.rotation.z = Math.sin(t * .6 + u.phase) * .05;
      u.pulse = Math.max(0, u.pulse - dt * .8);
      const flick = .92 + Math.sin(t * 9 + u.phase) * .04 + Math.sin(t * 23 + u.phase * 2) * .03;
      u.mat.uniforms.uGlow.value = (flick + u.pulse * .9) * u.dim * (1 + .25 * u.mat.uniforms.uForm.value);
      u.halo.material.opacity = (.32 + u.pulse * .6) * u.dim * (1 + .6 * u.mat.uniforms.uForm.value);
      u.flame.scale.set(.75 + Math.sin(t * 11 + u.phase) * .06, .9 + Math.sin(t * 13 + u.phase) * .1, 1);
    }

    for (let i = sparks.length - 1; i >= 0; i--) if (t > sparks[i].until) {
      scene.remove(sparks[i].obj); sparks[i].obj.geometry.dispose(); sparks[i].obj.material.dispose(); sparks.splice(i, 1);
    }

    if (fly) {
      const k = Math.min((performance.now() - fly.t0) / fly.dur, 1), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.copy(fly.curve.getPoint(e));
      controls.target.copy(fly.fromTarget).lerp(fly.toTarget, e);
      camera.lookAt(controls.target);
      if (k >= 1) { const done = fly.done; fly = null; controls.enabled = true; controls.update(); if (done) done(); }
    } else controls.update();

    composer.render();
    requestAnimationFrame(frame);
  }
  frame();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  });
})();
</script>
